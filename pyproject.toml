[project]
name = "dinov3-jax"
version = "0.1.0"
description = "DINOv3 jax port"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.8.2",
    "equinox",
    "jaxtyping",
    "numpy",
    "pydantic",
    "safetensors",
    "fa4-jax @ git+https://github.com/nshepperd/fa4-jax.git@main",
    "cutejax>=0.1.5",
]

[dependency-groups]
dev = [
    "jax[cuda13]",
    "nvidia-cutlass-dsl[cu13]>=4.7.0",
    # tests: HF reference model
    "pytest",
    "torch",
    "transformers>=4.56",  # first release with Dinov3VitModel
    "lovely-jax",
    "lovely-tensors",
    # vis_dpg.py
    "dearpygui",
    "matplotlib",
    "Pillow",
    # feature_vis_*.py / vis.ipynb scratch
    "torchvision",
    "scipy",
    "scikit-learn",
    "einops",
    "ipykernel",
    "ipywidgets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dinov3_jax"]

[tool.hatch]
metadata.allow-direct-references = true

[tool.uv]
# cutejax (an fa4-jax dependency) is newly published on PyPI, so it sits
# inside the global exclude-newer window; let through releases up to the date
# this was added, and no later ones.
exclude-newer-package = { cutejax = "2026-10-09" }

[tool.ruff.lint]
ignore = ["F722"]